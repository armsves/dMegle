<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dMegle - Start Live Streaming</title>
  <link rel="stylesheet" href="streamer.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎥 dMegle</h1>
      <p class="subtitle">Decentralized live streaming on Arkiv blockchain</p>
      <div class="status-bar">
        <span id="connectionStatus" class="status-indicator">Connecting...</span>
        <span id="accountAddress" class="account-info"></span>
      </div>
    </header>

    <main>
      <div class="card">
        <h2>Start Chatting</h2>
        <div class="form-group">
          <label for="streamTitle">Name (optional)</label>
          <input type="text" id="streamTitle" placeholder="Enter your name (or leave blank for auto-generated)">
        </div>
        <div class="form-group">
          <video id="cameraPreview" autoplay muted playsinline style="width: 100%; max-width: 640px; border-radius: 8px; background: #1a1a2e;"></video>
        </div>
        <div class="form-group">
          <button id="startCameraBtn" class="btn btn-primary">Start Video Chat</button>
          <button id="stopCameraBtn" class="btn btn-secondary" style="display: none;">Stop Streaming</button>
        </div>
        <div id="cameraStatus" class="stream-status"></div>
      </div>

      <div class="card">
        <h2>Chat Info</h2>
        <div id="streamInfo" class="stream-info">
          <p>Click "Start Video Chat" to begin chatting</p>
        </div>
        <div id="shareLink" class="share-link" style="display: none;">
          <h3>Share this link to watch:</h3>
          <input type="text" id="watchUrl" readonly>
          <button onclick="copyLink()" class="btn btn-secondary">Copy Link</button>
        </div>
      </div>
    </main>
  </div>

  <script src="streamer.js"></script>
</body>
</html>
