<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dMegle Logo</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      font-family: Arial, sans-serif;
    }
    .logo-container {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .dark-bg {
      background: #1a1a2e;
      padding: 30px;
      border-radius: 16px;
    }
    h2 {
      color: white;
      text-align: center;
      margin: 0 0 20px 0;
    }
    .download-buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #8B5CF6, #3B82F6);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
    }
  </style>
</head>
<body>
  <h2>dMegle Logo - Light Background</h2>
  <div class="logo-container">
    <svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
        </linearGradient>
      </defs>
      
      <g opacity="0.3">
        <circle cx="30" cy="30" r="3" fill="url(#iconGradient)"/>
        <circle cx="50" cy="20" r="3" fill="url(#iconGradient)"/>
        <circle cx="70" cy="30" r="3" fill="url(#iconGradient)"/>
        <circle cx="40" cy="50" r="3" fill="url(#iconGradient)"/>
        <circle cx="60" cy="50" r="3" fill="url(#iconGradient)"/>
        <line x1="30" y1="30" x2="50" y2="20" stroke="url(#iconGradient)" stroke-width="1.5"/>
        <line x1="50" y1="20" x2="70" y2="30" stroke="url(#iconGradient)" stroke-width="1.5"/>
        <line x1="30" y1="30" x2="40" y2="50" stroke="url(#iconGradient)" stroke-width="1.5"/>
        <line x1="70" y1="30" x2="60" y2="50" stroke="url(#iconGradient)" stroke-width="1.5"/>
        <line x1="40" y1="50" x2="60" y2="50" stroke="url(#iconGradient)" stroke-width="1.5"/>
      </g>
      
      <g transform="translate(20, 35)">
        <rect x="0" y="5" width="60" height="40" rx="6" fill="url(#iconGradient)" opacity="0.9"/>
        <circle cx="20" cy="25" r="12" fill="none" stroke="white" stroke-width="3"/>
        <circle cx="20" cy="25" r="8" fill="white" opacity="0.8"/>
        <circle cx="48" cy="15" r="4" fill="#EF4444">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <path d="M 55 25 L 75 25 M 70 20 L 75 25 L 70 30" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <rect x="75" y="15" width="20" height="20" rx="3" fill="white" opacity="0.9"/>
        <line x1="78" y1="20" x2="92" y2="20" stroke="url(#iconGradient)" stroke-width="2"/>
        <line x1="78" y1="25" x2="92" y2="25" stroke="url(#iconGradient)" stroke-width="2"/>
        <line x1="78" y1="30" x2="92" y2="30" stroke="url(#iconGradient)" stroke-width="2"/>
      </g>
      
      <text x="130" y="70" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradient)">
        dMegle
      </text>
      <text x="132" y="90" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">
        Decentralized Live Streaming
      </text>
    </svg>
  </div>

  <h2>dMegle Logo - Dark Background</h2>
  <div class="dark-bg">
    <svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="iconGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="textGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
        </linearGradient>
      </defs>
      
      <g opacity="0.4">
        <circle cx="30" cy="30" r="3" fill="url(#iconGradient2)"/>
        <circle cx="50" cy="20" r="3" fill="url(#iconGradient2)"/>
        <circle cx="70" cy="30" r="3" fill="url(#iconGradient2)"/>
        <circle cx="40" cy="50" r="3" fill="url(#iconGradient2)"/>
        <circle cx="60" cy="50" r="3" fill="url(#iconGradient2)"/>
        <line x1="30" y1="30" x2="50" y2="20" stroke="url(#iconGradient2)" stroke-width="1.5"/>
        <line x1="50" y1="20" x2="70" y2="30" stroke="url(#iconGradient2)" stroke-width="1.5"/>
        <line x1="30" y1="30" x2="40" y2="50" stroke="url(#iconGradient2)" stroke-width="1.5"/>
        <line x1="70" y1="30" x2="60" y2="50" stroke="url(#iconGradient2)" stroke-width="1.5"/>
        <line x1="40" y1="50" x2="60" y2="50" stroke="url(#iconGradient2)" stroke-width="1.5"/>
      </g>
      
      <g transform="translate(20, 35)">
        <rect x="0" y="5" width="60" height="40" rx="6" fill="url(#iconGradient2)" opacity="1"/>
        <circle cx="20" cy="25" r="12" fill="none" stroke="white" stroke-width="3"/>
        <circle cx="20" cy="25" r="8" fill="white" opacity="0.9"/>
        <circle cx="48" cy="15" r="4" fill="#EF4444">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <path d="M 55 25 L 75 25 M 70 20 L 75 25 L 70 30" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <rect x="75" y="15" width="20" height="20" rx="3" fill="white" opacity="0.95"/>
        <line x1="78" y1="20" x2="92" y2="20" stroke="url(#iconGradient2)" stroke-width="2"/>
        <line x1="78" y1="25" x2="92" y2="25" stroke="url(#iconGradient2)" stroke-width="2"/>
        <line x1="78" y1="30" x2="92" y2="30" stroke="url(#iconGradient2)" stroke-width="2"/>
      </g>
      
      <text x="130" y="70" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradient2)">
        dMegle
      </text>
      <text x="132" y="90" font-family="Arial, sans-serif" font-size="14" fill="#9CA3AF">
        Decentralized Live Streaming
      </text>
    </svg>
  </div>

  <div class="download-buttons">
    <a href="logo.svg" download class="btn">Download SVG</a>
    <a href="logo-icon.svg" download class="btn">Download Icon Only</a>
  </div>
</body>
</html>
